<svg
  width="256"
  height="256"
  viewBox="0 0 256 256"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <!-- Gradients -->
    <linearGradient id="topGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="midGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <linearGradient id="bottomGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <linearGradient id="lineGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>

    <!-- Shadows -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow
        dx="0"
        dy="8"
        stdDeviation="10"
        flood-color="#1E3A8A"
        flood-opacity="0.25"
      />
    </filter>

    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow
        dx="0"
        dy="4"
        stdDeviation="6"
        flood-color="#2563EB"
        flood-opacity="0.18"
      />
    </filter>
  </defs>

  <!-- Bottom Database -->
  <g filter="url(#shadow)">
    <ellipse
      cx="78"
      cy="152"
      rx="56"
      ry="16"
      fill="url(#bottomGradient)"
    />

    <path
      d="
        M22 152
        V182
        C22 190.837 47.072 198 78 198
        C108.928 198 134 190.837 134 182
        V152
      "
      fill="url(#bottomGradient)"
    />

    <ellipse
      cx="78"
      cy="152"
      rx="52"
      ry="13"
      fill="white"
      opacity="0.15"
    />
  </g>

  <!-- Middle Database -->
  <g filter="url(#shadow)">
    <ellipse
      cx="78"
      cy="104"
      rx="56"
      ry="16"
      fill="url(#midGradient)"
    />

    <path
      d="
        M22 104
        V134
        C22 142.837 47.072 150 78 150
        C108.928 150 134 142.837 134 134
        V104
      "
      fill="url(#midGradient)"
    />

    <ellipse
      cx="78"
      cy="104"
      rx="52"
      ry="13"
      fill="white"
      opacity="0.12"
    />
  </g>

  <!-- Top Database -->
  <g filter="url(#shadow)">
    <ellipse
      cx="78"
      cy="56"
      rx="56"
      ry="16"
      fill="url(#topGradient)"
    />

    <path
      d="
        M22 56
        V86
        C22 94.837 47.072 102 78 102
        C108.928 102 134 94.837 134 86
        V56
      "
      fill="url(#topGradient)"
    />

    <ellipse
      cx="78"
      cy="56"
      rx="52"
      ry="13"
      fill="white"
      opacity="0.16"
    />
  </g>

  <!-- Connection Line -->
  <path
    d="
      M134 166
      C162 166,
        164 202,
        194 202
    "
    stroke="url(#lineGradient)"
    stroke-width="8"
    stroke-linecap="round"
    fill="none"
    filter="url(#softShadow)"
  />

  <!-- Node -->
  <g filter="url(#softShadow)">
    <circle
      cx="212"
      cy="202"
      r="18"
      fill="url(#topGradient)"
    />

    <circle
      cx="212"
      cy="202"
      r="22"
      stroke="white"
      stroke-opacity="0.9"
      stroke-width="4"
    />
  </g>
</svg>